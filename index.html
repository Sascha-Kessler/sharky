<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="./img/1.Sharkie/1.IDLE/1.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharky</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/game.css" />
    <link rel="stylesheet" href="./styles/components.css" />

    <script src="./models/drawable-objects.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/movable-objects.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./js/input-manager.js"></script>

    <script src="./models/background.class.js"></script>
    <script src="./assets/character.images.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/character-movement.js"></script>
    <script src="./models/character-animation.js"></script>
    <script src="./models/character-attack.js"></script>
    <script src="./assets/puffer-fish.images.js"></script>
    <script src="./models/puffer-fish.class.js"></script>
    <script src="./models/puffer-fish-movement.js"></script>
    <script src="./models/puffer-fish-animation.js"></script>
    <script src="./assets/jelly-fish.images.js"></script>
    <script src="./models/jelly-fish.class.js"></script>
    <script src="./models/jelly-fish-movement.js"></script>
    <script src="./models/jelly-fish-animation.js"></script>
    <script src="./assets/endboss.images.js"></script>
    <script src="./models/boss-healthbar.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/endboss-movement.js"></script>
    <script src="./models/endboss-animation.js"></script>
    <script src="./models/endboss-attack.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/poison-bottle.js"></script>

    <script src="./models/healthbar.class.js"></script>
    <script src="./models/poisonbar.class.js"></script>
    <script src="./models/coinbar.class.js"></script>

    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>

    <script src="./models/world.class.js"></script>
    <script src="./js/collision-manager.js"></script>
    <script src="./js/sound-manager.js"></script>
    <script src="./js/ui-manager.js"></script>
    <script src="./js/game.js"></script>
  </head>

  <body onload="init()">
    <div class="water-effect"></div>

    <h1 id="game-name" class="game-name">Sharky</h1>

    <div id="start-screen" class="start-screen">
      <button id="start-btn" class="ocean-btn start-btn" onclick="startGame()">
        Start
      </button>

      <button
        id="option-btn"
        class="ocean-btn options-btn"
        onclick="openOptions()"
      >
        Options
      </button>
    </div>
    <button
      id="imprint-btn"
      class="ocean-btn imprint-btn"
      onclick="openImprint()"
    >
      Imprint
    </button>

    <div id="game-container" class="game-container d-none">
      <canvas id="canvas" class="canvas"></canvas>

      <div id="mobile-controls" class="mobile-controls">
        <button class="touch-btn up" data-key="UP">↑</button>

        <button class="touch-btn left" data-key="LEFT">←</button>

        <button class="touch-btn right" data-key="RIGHT">→</button>

        <button class="touch-btn down" data-key="DOWN">↓</button>
      </div>

      <div id="mobile-actions" class="mobile-actions">
        <button class="touch-btn action slap" data-key="FIN_SLAP">SL</button>
        <button class="touch-btn action normal" data-key="ATTACK">ATK</button>

        <button class="touch-btn action special" data-key="POISON">SP</button>
      </div>

      <div id="game-ui" class="game-ui d-none">
        <button
          id="pause-btn"
          class="ocean-btn pause-btn"
          onclick="togglePause()"
        >
          <img id="pause-icon" src="./img/pause.png" alt="" />
        </button>

        <button
          id="sound-btn"
          class="ocean-btn sound-btn"
          onclick="toggleSound()"
        >
          <img id="sound-icon" src="./img/sound.png" alt="" />
        </button>

        <button
          id="new-game-btn"
          class="ocean-btn end-game-btn"
          onclick="endGame()"
        >
          <img id="end-game-icon" src="./img/cross.png" alt="" />
        </button>
      </div>

      <div id="game-over-screen" class="game-over-screen d-none">
        <img src="../img/6.Botones/Tittles/Game Over/Recurso 9.png" alt="" />
        <button class="ocean-btn" onclick="endGame()">Retry</button>
      </div>

      <div id="win-screen" class="win-screen d-none">
        <img src="../img/6.Botones/Try again/Mesa de trabajo 1.png" alt="" />
        <button class="ocean-btn" onclick="endGame()">Retry</button>
      </div>
    </div>

    <div id="options-overlay" class="options-overlay d-none">
      <div class="options-content">
        <button
          id="options-overlay-close-button"
          class="options-overlay-close-button ocean-btn"
          onclick="closeOptions()"
        >
          ✖
        </button>

        <h2>Controls</h2>

        <ul class="controls-list">
          <li data-action="moveLeft">
            <span>Move left</span>
            <button class="keybind-btn">←</button>
          </li>

          <li data-action="moveRight">
            <span>Move right</span>
            <button class="keybind-btn">→</button>
          </li>

          <li data-action="moveUp">
            <span>Move up</span>
            <button class="keybind-btn">↑</button>
          </li>

          <li data-action="moveDown">
            <span>Move down</span>
            <button class="keybind-btn">↓</button>
          </li>

          <li data-action="FIN_SLAP">
            <span>Fin Slap</span>
            <button class="keybind-btn">V</button>
          </li>

          <li data-action="poisonAttack">
            <span>Poison Attack</span>
            <button class="keybind-btn">B</button>
          </li>

          <li data-action="normalAttack">
            <span>Normal Attack</span>
            <button class="keybind-btn">Space</button>
          </li>
        </ul>
      </div>
    </div>

    <div id="rotate-warning" class="rotate-warning d-none">
      Rotate your device for the best experience
    </div>

    <div id="imprint" class="options-overlay d-none">
      <div class="options-content">
        <button
          class="ocean-btn options-overlay-close-button"
          onclick="closeImprint()"
        >
          ✕
        </button>

        <h2>Imprint</h2>

        <div class="imprint-grid">
  <p><strong>Name:</strong><br />Sascha Kessler</p>

  <p>
    <strong>Address:</strong><br />
    Zum Waldweiher 17<br />
    66606 St.Wendel
  </p>

  <p><strong>Email:</strong><br />sascha@gmail.com</p>

  <p>
    <strong>Info:</strong><br />
    Educational project
  </p>
</div>
    </div>
  </body>
</html>
