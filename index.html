<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="./img/1.Sharkie/1.IDLE/1.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharky</title>
    <link rel="stylesheet" href="./style.css" />

    <!-- 1) Basis / Utilities -->
    <script src="./models/drawable-objects.class.js"></script>
    <script src="./models/movable-objects.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>

    <!-- 2) Game Objects (die von Level benutzt werden) -->
    <script src="./models/background.class.js"></script>
    <script src="./assets/character.images.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./assets/puffer-fish.images.js"></script>
    <script src="./models/puffer-fish.class.js"></script>
    <script src="./assets/jelly-fish.images.js"></script>
    <script src="./models/jelly-fish.class.js"></script>
    <script src="./assets/endboss.images.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/coins.class.js"></script>
    <script src="./models/poison-bottles.js"></script>
    <script src="./models/healthbar.class.js"></script>
    <script src="./models/poisonbar.class.js"></script>
    <script src="./models/coinbar.class.js"></script>

    <!-- 3) Level-Logik + Level-Daten -->
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>

    <!-- 4) World (benutzt level1) -->
    <script src="./models/world.class.js"></script>

    <!-- 5) Game init/loop (erst ganz am Ende) -->
    <script src="./js/game.js"></script>
  </head>

  <body onload="init()">
    <div id="fullscreen">
      <h1>Sharky</h1>
      <div id="startscreen">
        <button id="startBtn" class="ocean-btn start-btn" onclick="startGame()">
          Start
        </button>
        <button
          id="optionBtn"
          class="ocean-btn start-btn"
          onclick="openOptions()"
        >
          Options
        </button>
      </div>
      <div id="gameContainer" class="dnone">
        <canvas id="canvas"></canvas>
        <button
          id="pauseBtn"
          class="ocean-btn pause-btn"
          onclick="togglePause()"
        >
          Pause
        </button>
        <button
          id="soundBtn"
          class="ocean-btn sound-btn"
          onclick="toggleSound()"
        >
          Sound On
        </button>
        <button
          id="newGameBtn"
          class="ocean-btn end-game-btn"
          onclick="endGame()"
        >
          End Game
        </button>
        <div id="gameOverScreen" class="dnone">
          <img src="../img/6.Botones/Tittles/Game Over/Recurso 9.png" alt="" />
          <button class="ocean-btn" onclick="endGame()">Retry</button>
        </div>
        <div id="winScreen" class="dnone">
          <img src="../img/6.Botones/Try again/Mesa de trabajo 1.png" alt="" />
          <button class="ocean-btn" onclick="endGame()">Retry</button>
        </div>
      </div>

      <div id="options-overlay" class="dnone">
        <button
          id="options-overlay-close-button"
          class="ocean-btn"
          onclick="closeOptions()"
        >
          X
        </button>

        <h2>Steuerung</h2>

        <ul class="controls-list">
          <li data-action="moveLeft">
            <span>Move left</span>
            <button class="keybind-btn">A</button>
          </li>

          <li data-action="moveRight">
            <span>Move right</span>
            <button class="keybind-btn">D</button>
          </li>

          <li data-action="normalAttack">
            <span>Normal Attack</span>
            <button class="keybind-btn">Space</button>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
